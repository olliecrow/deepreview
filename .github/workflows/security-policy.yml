name: Security Policy Checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          # GitHub release-asset digest for the official v8.30.1 linux archive.
          expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          work="$RUNNER_TEMP/gitleaks-install"
          mkdir -p "${work}"
          curl -sSfL -o "${work}/${archive}" "${url}"
          echo "${expected}  ${work}/${archive}" | sha256sum -c -
          tar -xzf "${work}/${archive}" -C "${work}"
          install -m 0755 "${work}/gitleaks" "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Resolve the scan range
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            to="${PR_HEAD_SHA}"
            base="${PR_BASE_SHA}"
          else
            to="${GITHUB_SHA}"
            base="${PUSH_BEFORE_SHA}"
          fi
          from="$(bash scripts/security/resolve-scan-range.sh "${to}" "${base}")"
          echo "SCAN_FROM=${from}" >> "$GITHUB_ENV"
          echo "SCAN_TO=${to}" >> "$GITHUB_ENV"
          echo "scan range: ${from:-all history}..${to}"

      - name: Scan the range with gitleaks
        run: bash scripts/security/gitleaks-range.sh --from "${SCAN_FROM}" --to "${SCAN_TO}"

      - name: Scan commit messages, added lines, and paths
        run: PRE_COMMIT_FROM_REF="${SCAN_FROM}" PRE_COMMIT_TO_REF="${SCAN_TO}" bash scripts/security/check-push-range.sh

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test the security scripts with gitleaks
        env:
          DEEPREVIEW_REQUIRE_GITLEAKS: "1"
        run: go test -count=1 ./internal/deepreview/ -run 'TestGitleaks|TestCheckPushRange|TestCheckSensitiveText|TestResolveScanRange'

      - name: Check pull request title/body for policy violations
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          temp_file="$(mktemp)"
          printf '%s\n\n%s\n' "${PR_TITLE}" "${PR_BODY}" > "${temp_file}"
          bash scripts/security/check-sensitive-text.sh --context=pr-metadata "${temp_file}"
